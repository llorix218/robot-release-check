[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-release-check"
version = "0.1.0"
description = "Offline checks for robot release and acceptance-evidence consistency."
requires-python = ">=3.10"
authors = [{name = "llori"}]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["robotics", "release", "evidence", "acceptance", "traceability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
robot-release-check = "robot_release_check.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
