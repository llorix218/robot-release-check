<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Robot Release Evidence Review</title>
  <desc id="desc">A synthetic report showing delivered release v1.4.1, latest qualifying pass v1.4, evidence mismatch and evidence gap findings, and overall review required.</desc>
  <rect width="1400" height="760" fill="#eef1f5"/>
  <rect x="50" y="40" width="1300" height="680" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="100" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Robot Release Evidence Review</text>
  <text x="90" y="138" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Offline evidence-consistency review of the supplied project files.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="90" y="180" width="360" height="100" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="115" y="215" font-size="14" font-weight="700" fill="#475569">DELIVERED RELEASE</text>
    <text x="115" y="255" font-size="28" font-weight="700" fill="#0f172a">v1.4.1</text>

    <rect x="520" y="180" width="360" height="100" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="545" y="215" font-size="14" font-weight="700" fill="#475569">LATEST QUALIFYING PASS</text>
    <text x="545" y="255" font-size="28" font-weight="700" fill="#0f172a">v1.4</text>

    <rect x="950" y="180" width="360" height="100" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="975" y="215" font-size="14" font-weight="700" fill="#475569">OVERALL</text>
    <text x="975" y="255" font-size="26" font-weight="800" fill="#991b1b">REVIEW REQUIRED</text>

    <rect x="90" y="325" width="1220" height="250" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="90" y="325" width="1220" height="54" rx="14" fill="#f1f5f9"/>
    <text x="115" y="359" font-size="15" font-weight="700" fill="#334155">RULE</text>
    <text x="225" y="359" font-size="15" font-weight="700" fill="#334155">CHECK</text>
    <text x="650" y="359" font-size="15" font-weight="700" fill="#334155">RESULT</text>
    <text x="920" y="359" font-size="15" font-weight="700" fill="#334155">SUMMARY</text>

    <line x1="90" y1="440" x2="1310" y2="440" stroke="#dbe2ea"/>
    <line x1="90" y1="505" x2="1310" y2="505" stroke="#dbe2ea"/>

    <text x="115" y="416" font-size="16" font-weight="700" fill="#0f172a">R001</text>
    <text x="225" y="408" font-size="16" fill="#111827">Release/Test Identity</text>
    <text x="225" y="430" font-size="16" fill="#111827">Mismatch</text>
    <rect x="650" y="393" width="205" height="32" rx="16" fill="#fee2e2" stroke="#fecaca"/>
    <text x="670" y="415" font-size="14" font-weight="800" fill="#991b1b">EVIDENCE_MISMATCH</text>
    <text x="920" y="408" font-size="15" fill="#111827">Delivered release does not match</text>
    <text x="920" y="430" font-size="15" fill="#111827">latest qualifying PASS evidence.</text>

    <text x="115" y="482" font-size="16" font-weight="700" fill="#0f172a">R002</text>
    <text x="225" y="482" font-size="16" fill="#111827">Change After Last Qualifying Test</text>
    <rect x="650" y="458" width="155" height="32" rx="16" fill="#fef3c7" stroke="#fde68a"/>
    <text x="670" y="480" font-size="14" font-weight="800" fill="#92400e">EVIDENCE_GAP</text>
    <text x="920" y="474" font-size="15" fill="#111827">Changes supplied after PASS;</text>
    <text x="920" y="496" font-size="15" fill="#111827">no later qualifying PASS supplied.</text>

    <text x="115" y="548" font-size="16" font-weight="700" fill="#0f172a">R003</text>
    <text x="225" y="548" font-size="16" fill="#111827">Closure Without Verification Evidence</text>
    <rect x="650" y="524" width="92" height="32" rx="16" fill="#dcfce7" stroke="#bbf7d0"/>
    <text x="672" y="546" font-size="14" font-weight="800" fill="#166534">PASS</text>
    <text x="920" y="548" font-size="15" fill="#111827">Closure evidence reference supplied.</text>

    <rect x="90" y="615" width="1220" height="72" rx="10" fill="#f1f5f9"/>
    <rect x="90" y="615" width="6" height="72" rx="3" fill="#64748b"/>
    <text x="115" y="644" font-size="15" font-weight="700" fill="#1e293b">Interpretation boundary</text>
    <text x="115" y="669" font-size="15" fill="#334155">Findings identify gaps or mismatches in supplied evidence; they do not establish that the physical system was unsafe or untested.</text>
  </g>
</svg>
